    let current = 0;
    const container = document.getElementById("slides-container");
    const counter = document.getElementById("counter");
    const noteEl = document.getElementById("speaker-note");

    function renderSlides() {
      container.innerHTML = slides.map((s, idx) => `
        <div class="slide-card ${idx === 0 ? 'active' : ''}" id="slide-${idx}">
          <div class="slide-header">
            <div class="slide-tag">SLIDE ${s.num} // ${s.tag}</div>
            <div class="slide-title">${s.title}</div>
            <div class="slide-subtitle">${s.subtitle}</div>
          </div>
          <div class="slide-body">
            <div class="slide-left">
              ${s.bullets.map(b => `
                <div class="bullet-item">
                  <span class="bullet-arrow">▶</span>
                  <span>${b}</span>
                </div>
              `).join('')}
            </div>
            <div class="slide-right">
              <img src="${s.image}" class="slide-img" alt="Slide ${s.num}" onclick="window.open('${s.image}', '_blank')">
            </div>
          </div>
        </div>
      `).join('');
      updateUI();
    }

    function updateUI() {
      document.querySelectorAll('.slide-card').forEach((el, idx) => {
        el.classList.toggle('active', idx === current);
      });
      counter.innerText = `${current + 1} / ${slides.length}`;
      noteEl.innerText = `💡 Speaker Note: ${slides[current].note}`;
    }

    function nextSlide() {
      if (current < slides.length - 1) {
        current++;
        updateUI();
      }
    }

    function prevSlide() {
      if (current > 0) {
        current--;
        updateUI();
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
      if (e.key === "f" || e.key === "F") toggleFullscreen();
    });

    renderSlides();
  </script>
