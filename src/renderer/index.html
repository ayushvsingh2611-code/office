<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AgentHive</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.openai.com https://*.openai.com wss://api.openai.com wss://*.openai.com https://*.anthropic.com https://api.groq.com https://generativelanguage.googleapis.com wss://*.anthropic.com; media-src 'self' blob: mediastream:;" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- AgentHive modern fonts: Space Grotesk / Plus Jakarta Sans for headers & marks,
         Inter for body UI, JetBrains Mono for terminal/code displays -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      #cth-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #0b0f19; color: #f8fafc;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #cth-splash .mk {
        display: grid; place-items: center; width: 64px; height: 64px;
        background: #111827; color: #38bdf8; border: 1px solid #1e293b;
        font-family: "Space Grotesk", sans-serif; font-size: 24px;
        box-shadow: 0 4px 20px rgba(56,189,248,0.25);
        border-radius: 8px;
      }
      #cth-splash .title { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 13px; color: #f8fafc; letter-spacing: 2px; }
      #cth-splash .hint { font-size: 13px; color: #64748b; }
      #cth-splash .dot-anim { display: inline-block; animation: dots 1.4s steps(3,end) infinite; }
      @keyframes dots { 0%,100%{content:'.'} 33%{content:'..'} 66%{content:'...'} }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cth-splash">
        <div class="mk">🐼</div>
        <div class="title">AGENTHIVE</div>
        <div class="hint">waking up the hive<span class="dot-anim">...</span></div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
