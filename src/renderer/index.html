<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Panda Hive</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.openai.com https://*.openai.com wss://api.openai.com wss://*.openai.com https://*.anthropic.com https://api.groq.com https://generativelanguage.googleapis.com wss://*.anthropic.com; media-src 'self' blob: mediastream:;" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Panda Hive brand fonts: Press Start 2P for pixel brand marks,
         Inter for body UI, JetBrains Mono for terminal/code displays -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      #cth-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #0D1F12; color: #E8F5E3;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #cth-splash .mk {
        display: grid; place-items: center; width: 64px; height: 64px;
        background: #1A3A20; color: #7EDB6A; border: 3px solid #2E6B35;
        font-family: "Press Start 2P", monospace; font-size: 18px; letter-spacing: -1px;
        box-shadow: 0 0 24px rgba(126,219,106,0.35), 4px 4px 0 rgba(0,0,0,0.5);
        border-radius: 6px;
      }
      #cth-splash .title { font-family: "Press Start 2P", monospace; font-size: 12px; color: #7EDB6A; letter-spacing: 2px; }
      #cth-splash .hint { font-size: 14px; color: #4A7A52; }
      #cth-splash .dot-anim { display: inline-block; animation: dots 1.4s steps(3,end) infinite; }
      @keyframes dots { 0%,100%{content:'.'} 33%{content:'..'} 66%{content:'...'} }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cth-splash">
        <div class="mk">🐼</div>
        <div class="title">PANDA HIVE</div>
        <div class="hint">waking up the hive<span class="dot-anim">...</span></div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
